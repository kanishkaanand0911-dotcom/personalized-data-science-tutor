[pytest]
# Scope collection to tests/. The original app/educator*/test_harness.py files
# are standalone harnesses ("Run: python3 test_harness.py"), not pytest modules:
# they mock a provider SDK directly and the Anthropic one needs the optional
# `anthropic` package, so collecting them makes a bare `pytest` fail for reasons
# unrelated to the suite. They are left runnable exactly as they were.
testpaths = tests
addopts = -q
